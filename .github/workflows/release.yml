name: release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Validate release tag
        run: python3 scripts/check-release-version.py "$GITHUB_REF_NAME"
      - name: Require a commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Validate repository
        run: scripts/lint.sh
      - name: Publish release if absent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json tagName,isDraft,isPrerelease > "$RUNNER_TEMP/release.json" 2>/dev/null; then
            python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); sys.exit(1 if r["isDraft"] or r["isPrerelease"] else 0)' "$RUNNER_TEMP/release.json"
            echo "Published release already exists: $GITHUB_REF_NAME"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          fi
