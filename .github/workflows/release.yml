name: release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Validate release tag
        run: python3 scripts/check-release-version.py "$GITHUB_REF_NAME"
      - name: Require a commit on main
        run: |
          commit=$(git rev-parse HEAD)
          test "$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")" = "$commit"
          git merge-base --is-ancestor "$commit" origin/main
          echo "RELEASE_COMMIT=$commit" >> "$GITHUB_ENV"
      - name: Validate repository
        run: scripts/lint.sh
      - name: Publish release if absent
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-release.py
