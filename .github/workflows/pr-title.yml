# A title edit reruns this check without restarting the test suite.
name: PR title

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

concurrency:
  group: pr-title-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-title:
    uses: BehindTheMusicTree/github-workflows/.github/workflows/pr-title.yml@8b10f1dfcb88a245e4e4256e61164b49e595faea
